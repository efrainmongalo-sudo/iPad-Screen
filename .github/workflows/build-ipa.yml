name: Compilar IPA (iPad)

on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/build-ipa.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar proyecto de Xcode
        run: xcodegen generate

      - name: Compilar sin firmar
        run: |
          xcodebuild \
            -project MonitorSecundario.xcodeproj \
            -scheme MonitorSecundario \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Empaquetar .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/MonitorSecundario.app Payload/
          zip -qr MonitorSecundario.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: MonitorSecundario-ipa
          path: ios/MonitorSecundario.ipa
