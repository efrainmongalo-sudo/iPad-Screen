name: Compilar APK de Android

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/build-apk.yml']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: Preparar APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk MonitorSecundario.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MonitorSecundario-apk
          path: MonitorSecundario.apk
